<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>德曜精密業務電訪記錄</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;background:#f5f6f8;color:#20242a}header{background:#16212b;color:white;padding:22px}header h1{margin:0 0 5px;font-size:26px}header p{margin:0;color:#d8e0e7}.wrap{max-width:1180px;margin:auto;padding:18px}.box{background:white;border:1px solid #dfe3e7;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #0000000b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.wide{grid-column:span 2}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #cfd5da;border-radius:9px;background:white}textarea{min-height:90px}.actions,.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid #cbd2d8;background:white;border-radius:9px;padding:9px 13px;cursor:pointer}.primary{background:#16212b;color:white}.danger{color:#a52626}.msg{margin-left:8px;font-size:13px}.records{display:grid;gap:10px}.card{border:1px solid #dfe3e7;border-radius:12px;padding:14px}.top{display:flex;justify-content:space-between;gap:10px}.company{font-size:18px;font-weight:800}.meta{color:#66717b;font-size:13px;margin-top:4px}.detail{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px;font-size:14px}.badge{padding:5px 9px;border-radius:999px;background:#e9f6ee;color:#176b37;font-size:12px;height:max-content}.no{background:#fbeaea;color:#9c2929}.login{position:fixed;inset:0;background:#16212b;display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}.loginbox{width:min(420px,100%);background:white;border-radius:16px;padding:24px}.loginbox h2{margin-top:0}.hidden{display:none!important}.summary{font-weight:700;padding:9px 0}.logout{float:right;background:transparent;color:white;border:1px solid #ffffff55;border-radius:8px;padding:7px 10px}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.detail{grid-template-columns:1fr}header h1{font-size:21px}}</style></head><body>
<div id="login" class="login"><form id="loginForm" class="loginbox"><h2>德曜精密業務電訪記錄</h2><p>請輸入系統密碼後進入。</p><input id="pw" type="password" required autocomplete="current-password" placeholder="系統密碼"><div class="actions"><button class="btn primary">登入</button><span id="loginMsg" class="msg"></span></div></form></div>
<header><button id="logout" class="logout">登出</button><h1>德曜精密業務電訪記錄</h1><p>加油!拿出勇氣!我們是最棒的!</p></header>
<main class="wrap"><section class="box"><h2 id="formTitle">新增電訪紀錄</h2><form id="form"><div class="grid">
<div><label>電訪日期</label><input id="visit_date" type="date" required></div><div><label>公司名稱</label><input id="company_name" required></div><div><label>公司地址</label><input id="company_address"></div>
<div><label>聯絡人</label><input id="contact_name"></div><div><label>電話</label><input id="phone"></div><div><label>Email</label><input id="email" type="email"></div>
<div><label>是否已寄送Mail</label><select id="mail_sent"><option value="true">是</option><option value="false">否</option></select></div><div><label>是否適合拜訪</label><select id="visit_suitable"><option value="true">適合拜訪</option><option value="false">暫不拜訪</option></select></div>
<div><label>地區</label><select id="area"><option value="">未分類</option><option>北部</option><option>桃園</option><option>新竹</option><option>苗栗</option><option>嘉義</option><option>台南</option><option>高雄</option><option>屏東</option></select></div>
<div><label>紀錄者</label><input id="recorder"></div><div class="wide"><label>公司官網</label><input id="website"></div><div class="wide"><label>備註</label><textarea id="notes"></textarea></div></div>
<div class="actions"><button class="btn primary" type="submit">儲存資料</button><button class="btn" id="cancel" type="button">清除／取消編輯</button><span id="msg" class="msg"></span></div></form></section>
<section class="box"><h2>客戶名單</h2><div class="grid"><div class="wide"><label>搜尋</label><input id="search" type="search" placeholder="公司、聯絡人、電話、地址、Email、備註…"></div><div><label>依電訪日期</label><input id="dateFilter" type="date"></div></div>
<div class="tools"><button class="btn" id="clearDate">清除日期</button><button class="btn" id="exportCsv">匯出 CSV</button><button class="btn" id="exportExcel">匯出 Excel</button></div><div id="summary" class="summary"></div><div id="records" class="records"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL="https://qprzfciypaiwvbkiiapo.supabase.co",KEY="sb_publishable_Bmn5OtlbGuGqQC4x0dNv7A_9_zldV2B",EMAIL="dy53886231@gmail.com";
const sb=supabase.createClient(URL,KEY),$=x=>document.getElementById(x);let data=[],editing=null;
const fields=["visit_date","company_name","company_address","contact_name","phone","email","recorder","area","website","notes"];
function today(){return new Date().toISOString().slice(0,10)} function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function reset(){editing=null;$("form").reset();$("visit_date").value=today();$("formTitle").textContent="新增電訪紀錄";$("msg").textContent=""}
function payload(){let o={};fields.forEach(k=>o[k]=$(k).value.trim());o.mail_sent=$("mail_sent").value==="true";o.visit_suitable=$("visit_suitable").value==="true";return o}
async function load(){let {data:d,error}=await sb.from("cold_call_records").select("*").order("visit_date",{ascending:false}).order("created_at",{ascending:false});if(error){$("summary").textContent="讀取失敗："+error.message;return}data=d||[];render()}
function shown(){let q=$("search").value.toLowerCase().replace(/\s/g,""),dt=$("dateFilter").value;return data.filter(r=>(!dt||r.visit_date===dt)&&(!q||Object.values(r).join(" ").toLowerCase().replace(/\s/g,"").includes(q)))}
function render(){let a=shown();$("summary").textContent=($("dateFilter").value?$("dateFilter").value+" 電訪 ":"目前顯示 ")+a.length+" 筆";$("records").innerHTML=a.length?a.map(r=>`<article class="card"><div class="top"><div><div class="company">${esc(r.company_name)}</div><div class="meta">${esc(r.visit_date||"")} ｜ 聯絡人：${esc(r.contact_name||"未填")}</div></div><span class="badge ${r.visit_suitable?"":"no"}">${r.visit_suitable?"適合拜訪":"暫不拜訪"}</span></div><div class="detail"><div>🏢 ${esc(r.company_address||"未提供")}</div><div>📞 ${esc(r.phone||"未提供")}</div><div>✉️ ${esc(r.email||"未提供")}（${r.mail_sent?"已寄送Mail":"未寄送Mail"}）</div><div>📍 ${esc(r.area||"未分類")}</div><div>👤 ${esc(r.recorder||"未指定")}</div><div>📝 ${esc(r.notes||"尚無備註")}</div></div><div class="actions"><button class="btn" onclick="editRec(${r.id})">編輯</button><button class="btn danger" onclick="delRec(${r.id})">刪除</button></div></article>`).join(""):'<p>目前沒有符合條件的資料。</p>'}
window.editRec=id=>{let r=data.find(x=>x.id===id);if(!r)return;editing=id;fields.forEach(k=>$(k).value=r[k]??"");$("mail_sent").value=String(!!r.mail_sent);$("visit_suitable").value=String(!!r.visit_suitable);$("formTitle").textContent="編輯電訪紀錄";scrollTo({top:0,behavior:"smooth"})}
window.delRec=async id=>{if(!confirm("確定刪除這筆紀錄？"))return;let {error}=await sb.from("cold_call_records").delete().eq("id",id);if(error)alert(error.message);else load()}
$("form").onsubmit=async e=>{e.preventDefault();let p=payload(),q=editing?sb.from("cold_call_records").update({...p,updated_at:new Date().toISOString()}).eq("id",editing):sb.from("cold_call_records").insert(p),{error}=await q;if(error){$("msg").textContent="儲存失敗："+error.message;return}reset();await load();$("msg").textContent="已儲存並同步雲端"}
$("cancel").onclick=reset;$("search").oninput=render;$("dateFilter").onchange=render;$("clearDate").onclick=()=>{$("dateFilter").value="";render()};
function exportRows(){return shown().map(r=>({"電訪日期":r.visit_date,"公司名稱":r.company_name,"公司地址":r.company_address,"聯絡人":r.contact_name,"電話":r.phone,"Email":r.email,"是否已寄送Mail":r.mail_sent?"是":"否","是否適合拜訪":r.visit_suitable?"是":"否","地區":r.area,"紀錄者":r.recorder,"公司官網":r.website,"備註":r.notes}))}
function csv(){let a=exportRows(),h=Object.keys(a[0]||{"公司名稱":""}),rows=[h,...a.map(o=>h.map(k=>o[k]??""))],s="\ufeff"+rows.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n"),b=new Blob([s],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(b),ael=document.createElement("a");ael.href=u;ael.download="德曜精密業務電訪記錄.csv";ael.click();URL.revokeObjectURL(u)}
$("exportCsv").onclick=csv;$("exportExcel").onclick=csv;
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginMsg").textContent="登入中…";let {error}=await sb.auth.signInWithPassword({email:EMAIL,password:$("pw").value});if(error){$("loginMsg").textContent="密碼錯誤，請重新輸入";return}$("login").classList.add("hidden");$("pw").value="";await load();reset()}
$("logout").onclick=async()=>{await sb.auth.signOut();$("login").classList.remove("hidden")};
(async()=>{reset();let {data:{session}}=await sb.auth.getSession();if(session){$("login").classList.add("hidden");await load()}})();
</script></body></html>
