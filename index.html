<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>德曜精密業務電訪記錄</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;background:linear-gradient(135deg,#eef4ff 0%,#dbe8ff 32%,#b8cdf7 68%,#3153a4 100%);background-attachment:fixed;color:#20242a}header{background:linear-gradient(135deg,rgba(255,255,255,.97),rgba(232,240,255,.94));color:#16212b;padding:18px 22px;text-align:center;border-bottom:1px solid #dfe3e7}header h1{margin:0 0 5px;font-size:26px}header p{margin:0;color:#3153a4;font-weight:700}.brand-logo{display:block;width:min(650px,88vw);height:auto;margin:0 auto 10px}.wrap{max-width:1180px;margin:auto;padding:18px}.box{background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border:1px solid #dfe3e7;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #0000000b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.wide{grid-column:span 2}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #cfd5da;border-radius:9px;background:white}textarea{min-height:90px}.actions,.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid #cbd2d8;background:white;border-radius:9px;padding:9px 13px;cursor:pointer}.primary{background:#16212b;color:white}.danger{color:#a52626}.msg{margin-left:8px;font-size:13px}.records{display:grid;gap:10px}.card{border:1px solid #dfe3e7;border-radius:12px;padding:14px}.top{display:flex;justify-content:space-between;gap:10px}.company{font-size:18px;font-weight:800}.meta{color:#66717b;font-size:13px;margin-top:4px}.detail{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px;font-size:14px}.badge{padding:5px 9px;border-radius:999px;background:#e9f6ee;color:#176b37;font-size:12px;height:max-content}.no{background:#fbeaea;color:#9c2929}.login{position:fixed;inset:0;background:#16212b;display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}.loginbox{width:min(420px,100%);background:white;border-radius:16px;padding:24px}.loginbox h2{margin-top:0}.hidden{display:none!important}.summary{font-weight:700;padding:9px 0}.logout{background:transparent;color:#16212b;border:1px solid #16212b55;border-radius:8px;padding:7px 10px}.account-actions{position:absolute;right:22px;top:18px;display:flex;gap:8px;align-items:center}.role-pill{font-size:12px;background:#e8efff;color:#3153a4;padding:6px 9px;border-radius:999px}.staff-row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #dfe3e7;border-radius:10px;padding:10px;margin-top:8px}.staff-info{font-size:14px}.editor-only-note{background:#eef4ff;border-radius:10px;padding:10px;color:#3153a4;margin-bottom:12px}@media(max-width:760px){.account-actions{position:static;justify-content:center;margin-bottom:10px}}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.detail{grid-template-columns:1fr}header h1{font-size:21px}}</style></head><body>
<div id="login" class="login"><form id="loginForm" class="loginbox"><h2>德曜精密業務電訪記錄</h2><p>請輸入工號與密碼登入。</p><label>工號</label><input id="employeeNo" required autocomplete="username" placeholder="例如：A001"><label style="margin-top:12px">密碼</label><input id="pw" type="password" required autocomplete="current-password" placeholder="密碼"><div class="actions"><button class="btn primary">登入</button><span id="loginMsg" class="msg"></span></div></form></div>
<div id="changePassword" class="login hidden"><form id="changePasswordForm" class="loginbox"><h2>修改密碼</h2><label>新密碼</label><input id="changePw1" type="password" minlength="6" required autocomplete="new-password" placeholder="至少 6 個字元"><label style="margin-top:12px">再次輸入新密碼</label><input id="changePw2" type="password" minlength="6" required autocomplete="new-password" placeholder="再次輸入"><div class="actions"><button class="btn primary">確認修改</button><button id="cancelChangePassword" class="btn" type="button">取消</button><span id="changePwMsg" class="msg"></span></div></form></div>
<div id="recovery" class="login hidden"><form id="recoveryForm" class="loginbox"><h2>設定新密碼</h2><p>請輸入新的系統密碼。</p><label>新密碼</label><input id="newPw" type="password" minlength="6" required autocomplete="new-password" placeholder="至少 6 個字元"><label style="margin-top:12px">再次輸入新密碼</label><input id="newPw2" type="password" minlength="6" required autocomplete="new-password" placeholder="再次輸入"><div class="actions"><button class="btn primary">更新密碼</button><span id="recoveryMsg" class="msg"></span></div></form></div>

<main class="wrap"><section class="box"><h2 id="formTitle">新增電訪紀錄</h2><form id="form"><div class="grid">
<div><label>電訪日期</label><input id="visit_date" type="date" required></div><div><label>公司名稱</label><input id="company_name" required></div><div><label>公司地址</label><input id="company_address"></div>
<div><label>聯絡人</label><input id="contact_name"></div><div><label>電話</label><input id="phone"></div><div><label>Email</label><input id="email" type="email"></div>
<div><label>是否已寄送Mail</label><select id="mail_sent"><option value="false">未寄送Mail</option><option value="true">已寄送Mail</option></select></div><div><label>是否適合拜訪</label><select id="visit_suitable"><option value="true">適合拜訪</option><option value="false">暫不拜訪</option></select></div>
<div><label>縣市（依地址自動判斷）</label><select id="area"><option value="">未分類</option><option>基隆市</option><option>台北市</option><option>新北市</option><option>桃園市</option><option>新竹市</option><option>新竹縣</option><option>苗栗縣</option><option>台中市</option><option>彰化縣</option><option>南投縣</option><option>雲林縣</option><option>嘉義市</option><option>嘉義縣</option><option>台南市</option><option>高雄市</option><option>屏東縣</option><option>宜蘭縣</option><option>花蓮縣</option><option>台東縣</option><option>澎湖縣</option><option>金門縣</option><option>連江縣</option></select></div>
<div><label>紀錄者</label><select id="recorder"><option value="">請選擇紀錄者</option><option>王曜容</option><option>蔡喜禎</option></select></div><div class="wide"><label>公司官網</label><input id="website"></div><div class="wide"><label>備註</label><textarea id="notes"></textarea></div></div>
<div class="actions"><button class="btn primary" type="submit">儲存資料</button><button class="btn" id="cancel" type="button">清除／取消編輯</button><span id="msg" class="msg"></span></div></form></section>
<section id="customerSection" class="box"><h2>客戶名單</h2><div class="grid"><div class="wide"><label>搜尋</label><input id="search" type="search" placeholder="公司、聯絡人、電話、地址、Email、備註…"></div><div><label>依電訪日期</label><input id="dateFilter" type="date"></div><div><label>依地區</label><select id="areaFilter"><option value="">全部地區</option><option>基隆市</option><option>台北市</option><option>新北市</option><option>桃園市</option><option>新竹市</option><option>新竹縣</option><option>苗栗縣</option><option>台中市</option><option>彰化縣</option><option>南投縣</option><option>雲林縣</option><option>嘉義市</option><option>嘉義縣</option><option>台南市</option><option>高雄市</option><option>屏東縣</option><option>宜蘭縣</option><option>花蓮縣</option><option>台東縣</option><option>澎湖縣</option><option>金門縣</option><option>連江縣</option><option value="未分類">未分類</option></select></div></div>
<div class="tools"><button class="btn" id="clearDate">清除日期</button><button class="btn" id="refresh">重新整理</button><button class="btn" id="importExcel">匯入 Excel</button><input id="importFile" type="file" accept=".xlsx,.xls,.csv" class="hidden"><button class="btn" id="exportExcel">匯出 Excel (.xlsx)</button><button class="btn" id="exportCsv">匯出 CSV</button></div><div id="summary" class="summary"></div><div id="records" class="records"></div></section>
<section id="staffSection" class="box hidden"><h2>人員管理</h2><form id="staffForm"><div class="grid"><div><label>工號</label><input id="staffEmployeeNo" required placeholder="例如：A001"></div><div><label>姓名</label><input id="staffName" required></div><div><label>初始密碼</label><input id="staffPassword" type="password" minlength="6" required placeholder="至少 6 個字元"></div></div><div class="actions"><button class="btn primary">新增編輯人員</button><span id="staffMsg" class="msg"></span></div></form><div id="staffList"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const SUPABASE_URL="https://qprzfciypaiwvbkiiapo.supabase.co",KEY="sb_publishable_Bmn5OtlbGuGqQC4x0dNv7A_9_zldV2B",EMAIL="sales@de-yao.com.tw";
const sb=supabase.createClient(SUPABASE_URL,KEY),$=x=>document.getElementById(x);let data=[],editing=null,currentProfile=null;
const fields=["visit_date","company_name","company_address","contact_name","phone","email","recorder","area","website","notes"];
function today(){return new Date().toISOString().slice(0,10)} function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const CITY_ALIASES=[["台北市",["台北市","臺北市"]],["新北市",["新北市","台北縣","臺北縣"]],["基隆市",["基隆市"]],["桃園市",["桃園市","桃園縣"]],["新竹市",["新竹市"]],["新竹縣",["新竹縣"]],["苗栗縣",["苗栗縣"]],["台中市",["台中市","臺中市","台中縣","臺中縣"]],["彰化縣",["彰化縣"]],["南投縣",["南投縣"]],["雲林縣",["雲林縣"]],["嘉義市",["嘉義市"]],["嘉義縣",["嘉義縣"]],["台南市",["台南市","臺南市","台南縣","臺南縣"]],["高雄市",["高雄市","高雄縣"]],["屏東縣",["屏東縣"]],["宜蘭縣",["宜蘭縣"]],["花蓮縣",["花蓮縣"]],["台東縣",["台東縣","臺東縣"]],["澎湖縣",["澎湖縣"]],["金門縣",["金門縣"]],["連江縣",["連江縣"]]];
function detectCity(address){let s=String(address||"").replace(/\s/g,"");for(const [city,names] of CITY_ALIASES){if(names.some(n=>s.includes(n)))return city}return ""}
function syncCityFromAddress(){let city=detectCity($("company_address").value);if(city)$("area").value=city}
function reset(){editing=null;$("form").reset();$("visit_date").value=today();$("formTitle").textContent="新增電訪紀錄";$("msg").textContent=""}
function payload(){let o={};fields.forEach(k=>o[k]=$(k).value.trim());o.mail_sent=!!o.email&&$("mail_sent").value==="true";o.visit_suitable=$("visit_suitable").value==="true";return o}
async function load(){if(!currentProfile||currentProfile.role!=="admin")return;let {data:d,error}=await sb.from("cold_call_records").select("*").order("visit_date",{ascending:false}).order("created_at",{ascending:false});if(error){$("summary").textContent="讀取失敗："+error.message;return}data=d||[];render()}
function shown(){let q=$("search").value.toLowerCase().replace(/\s/g,""),dt=$("dateFilter").value,af=$("areaFilter").value;return data.filter(r=>(!dt||r.visit_date===dt)&&(!af||(af==="未分類"?!r.area:r.area===af))&&(!q||Object.values(r).join(" ").toLowerCase().replace(/\s/g,"").includes(q)))}
function render(){let a=shown(),dt=$("dateFilter").value;$("summary").textContent=(dt?dt+" 當日電訪共 ":"搜尋結果共 ")+a.length+" 筆｜雲端總資料 "+data.length+" 筆";$("records").innerHTML=a.length?a.map(r=>`<article class="card"><div class="top"><div><div class="company">${esc(r.company_name)}</div><div class="meta">${esc(r.visit_date||"")} ｜ 聯絡人：${esc(r.contact_name||"未填")}</div></div><span class="badge ${r.visit_suitable?"":"no"}">${r.visit_suitable?"適合拜訪":"暫不拜訪"}</span></div><div class="detail"><div>🏢 ${esc(r.company_address||"未提供")}</div><div>📞 ${esc(r.phone||"未提供")}</div><div>✉️ ${esc(r.email||"未提供")}（${r.mail_sent?"已寄送Mail":"未寄送Mail"}）</div><div>📍 ${esc(r.area||"未分類")}</div><div>👤 ${esc(r.recorder||"未指定")}</div><div>📝 ${esc(r.notes||"尚無備註")}</div></div><div class="actions"><button class="btn" onclick="editRec(${r.id})">編輯</button><button class="btn danger" onclick="delRec(${r.id})">刪除</button></div></article>`).join(""):'<p>目前沒有符合條件的資料。</p>'}
window.editRec=id=>{let r=data.find(x=>x.id===id);if(!r)return;editing=id;fields.forEach(k=>$(k).value=r[k]??"");$("mail_sent").value=String(!!r.mail_sent);$("visit_suitable").value=String(!!r.visit_suitable);$("formTitle").textContent="編輯電訪紀錄";scrollTo({top:0,behavior:"smooth"})}
window.delRec=async id=>{if(!confirm("確定刪除這筆紀錄？"))return;let {error}=await sb.from("cold_call_records").delete().eq("id",id);if(error)alert(error.message);else load()}
function norm(s){return String(s??"").trim().toLowerCase().replace(/\s+/g,"")}
function findDuplicate(p){let cn=norm(p.company_name),ph=norm(p.phone).replace(/[^0-9+]/g,""),em=norm(p.email);return data.find(r=>r.id!==editing&&((cn&&norm(r.company_name)===cn)||(ph&&norm(r.phone).replace(/[^0-9+]/g,"")===ph)||(em&&norm(r.email)===em)))}
$("form").onsubmit=async e=>{e.preventDefault();let p=payload(),dup=findDuplicate(p);if(dup){alert("⚠️ 已有客戶資訊！\n\n公司名稱："+(dup.company_name||"未填")+"\n聯絡人："+(dup.contact_name||"未填")+"\n電話："+(dup.phone||"未填")+"\nEmail："+(dup.email||"未填")+"\n\n請先確認客戶名單，避免重複建立資料。");return}let q=editing?sb.from("cold_call_records").update({...p,updated_at:new Date().toISOString()}).eq("id",editing):sb.from("cold_call_records").insert(p),{error}=await q;if(error){$("msg").textContent="儲存失敗："+error.message;return}reset();if(currentProfile?.role==="admin")await load();$("msg").textContent=currentProfile?.role==="admin"?"已儲存並同步雲端":"已成功上傳資料"}
$("email").addEventListener("input",()=>{if(!$("email").value.trim())$("mail_sent").value="false"});$("email").addEventListener("change",()=>{if(!$("email").value.trim())$("mail_sent").value="false"});$("company_address").addEventListener("input",syncCityFromAddress);$("company_address").addEventListener("change",syncCityFromAddress);$("cancel").onclick=reset;$("search").oninput=render;$("dateFilter").onchange=render;$("areaFilter").onchange=render;$("clearDate").onclick=()=>{$("dateFilter").value="";render()};
function exportRows(){return shown().map(r=>({"電訪日期":r.visit_date,"公司名稱":r.company_name,"公司地址":r.company_address,"聯絡人":r.contact_name,"電話":r.phone,"Email":r.email,"是否已寄送Mail":r.mail_sent?"是":"否","是否適合拜訪":r.visit_suitable?"是":"否","地區":r.area,"紀錄者":r.recorder,"公司官網":r.website,"備註":r.notes}))}
function csv(){let a=exportRows(),h=Object.keys(a[0]||{"公司名稱":""}),rows=[h,...a.map(o=>h.map(k=>o[k]??""))],s="\ufeff"+rows.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n"),b=new Blob([s],{type:"text/csv;charset=utf-8"}),u=window.URL.createObjectURL(b),ael=document.createElement("a");ael.href=u;ael.download="德曜精密業務電訪記錄.csv";ael.click();window.URL.revokeObjectURL(u)}
$("exportCsv").onclick=csv;
$("exportExcel").onclick=()=>{let rows=exportRows();if(!rows.length){alert("目前沒有可匯出的資料");return}let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"電訪紀錄");XLSX.writeFile(wb,"德曜精密業務電訪記錄.xlsx")};
$("refresh").onclick=load;

$("importFile").onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:"array"}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});if(!rows.length){alert("Excel 沒有可匯入的資料");return}
let yn=v=>["是","true","1","yes","y","已寄送","適合","適合拜訪"].includes(String(v).trim().toLowerCase());
let mapped=rows.map(r=>({visit_date:String(r["電訪日期"]||today()).slice(0,10),company_name:String(r["公司名稱"]||"").trim(),company_address:String(r["公司地址"]||""),contact_name:String(r["聯絡人"]||""),phone:String(r["電話"]||""),email:String(r["Email"]||r["email"]||""),mail_sent:yn(r["是否已寄送Mail"]),visit_suitable:yn(r["是否適合拜訪"]),area:detectCity(r["公司地址"])||String(r["縣市"]||r["地區"]||""),recorder:String(r["紀錄者"]||""),website:String(r["公司官網"]||""),notes:String(r["備註"]||"")})).filter(r=>r.company_name);
if(!mapped.length){alert("找不到「公司名稱」欄位或沒有有效資料");return}
if(!confirm("即將匯入 "+mapped.length+" 筆資料到雲端，確定繼續？"))return;
let {error}=await sb.from("cold_call_records").insert(mapped);if(error)throw error;alert("匯入成功："+mapped.length+" 筆");await load()
}catch(err){alert("匯入失敗："+(err.message||err))}finally{e.target.value=""}};
async function getProfile(){let {data:{user}}=await sb.auth.getUser();if(!user)return null;let {data:p,error}=await sb.from("staff_profiles").select("id,employee_no,name,role,active").eq("id",user.id).single();if(error||!p||!p.active)return null;return p}
function loginEmail(employeeNo){let n=String(employeeNo||"").trim().toUpperCase();return n==="ADMIN"?EMAIL:n.toLowerCase()+"@staff.de-yao.local"}
async function applyRole(){currentProfile=await getProfile();if(!currentProfile){await sb.auth.signOut();$("login").classList.remove("hidden");$("loginMsg").textContent="此帳號未啟用或沒有系統權限";return}let admin=currentProfile.role==="admin";$("login").classList.add("hidden");$("customerSection").classList.toggle("hidden",!admin);$("staffSection").classList.toggle("hidden",!admin);$("rolePill").textContent=(admin?"管理員":"編輯人員")+"｜"+currentProfile.name+" "+currentProfile.employee_no;if(admin){await load();await loadStaff()}else{data=[];$("recorder").value=currentProfile.name;$("recorder").disabled=true;$("formTitle").textContent="新增電訪紀錄（僅可上傳）";$("msg").textContent="編輯人員模式：資料送出後無法查閱客戶名單"}reset()}
async function loadStaff(){if(currentProfile?.role!=="admin")return;let {data:s,error}=await sb.from("staff_profiles").select("id,employee_no,name,role,active,created_at").order("created_at");if(error){$("staffList").innerHTML="<p>讀取人員失敗："+esc(error.message)+"</p>";return}$("staffList").innerHTML=(s||[]).map(x=>{let self=x.id===currentProfile.id,master=x.employee_no==="ADMIN";let buttons="";if(!master){if(x.role==="editor"){buttons='<button class="btn" onclick="staffAction(\'make_admin\',\''+x.id+'\')">設為管理員</button> <button class="btn" onclick="staffAction(\''+(x.active?"disable":"enable")+'\',\''+x.id+'\')">'+(x.active?"停用":"啟用")+'</button> <button class="btn danger" onclick="staffAction(\'delete\',\''+x.id+'\')">刪除</button>'}else if(!self){buttons='<button class="btn" onclick="staffAction(\'make_editor\',\''+x.id+'\')">改為編輯人員</button>'}}return '<div class="staff-row"><div class="staff-info"><b>'+esc(x.name)+'</b>｜工號 '+esc(x.employee_no)+'｜'+(x.role==="admin"?"管理員":(x.active?"編輯人員・啟用":"編輯人員・已停用"))+'</div><div>'+buttons+'</div></div>'}).join("")}
async function callStaff(body){let {data:{session}}=await sb.auth.getSession();let r=await fetch(SUPABASE_URL+"/functions/v1/manage-staff",{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY,"Authorization":"Bearer "+session.access_token},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw new Error(j.error||"操作失敗");return j}
$("staffForm").onsubmit=async e=>{e.preventDefault();$("staffMsg").textContent="建立中…";try{let j=await callStaff({action:"create",employee_no:$("staffEmployeeNo").value,name:$("staffName").value,password:$("staffPassword").value});$("staffMsg").textContent=j.message;$("staffForm").reset();await loadStaff()}catch(err){$("staffMsg").textContent="建立失敗："+err.message}}
window.staffAction=async(action,id)=>{let word=action==="delete"?"刪除":action==="disable"?"停用":action==="enable"?"啟用":action==="make_admin"?"設為管理員":"改為編輯人員";if(!confirm("確定要將這位人員"+word+"？"))return;try{let j=await callStaff({action,user_id:id});alert(j.message);await loadStaff()}catch(err){alert("操作失敗："+err.message)}}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginMsg").textContent="登入中…";let email=loginEmail($("employeeNo").value);let {error}=await sb.auth.signInWithPassword({email,password:$("pw").value});if(error){$("loginMsg").textContent="工號或密碼錯誤";return}$("pw").value="";$("loginMsg").textContent="";await applyRole()}

(async()=>{reset();let {data:{session}}=await sb.auth.getSession();if(session)await applyRole()})();
