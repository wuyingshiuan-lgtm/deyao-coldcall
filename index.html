<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;background:#f5f6f8;color:#20242a}header{background:#16212b;color:white;padding:22px}header h1{margin:0 0 5px;font-size:26px}header p{margin:0;color:#d8e0e7}.wrap{max-width:1180px;margin:auto;padding:18px}.box{background:white;border:1px solid #dfe3e7;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #0000000b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.wide{grid-column:span 2}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #cfd5da;border-radius:9px;background:white}textarea{min-height:90px}.actions,.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid #cbd2d8;background:white;border-radius:9px;padding:9px 13px;cursor:pointer}.primary{background:#16212b;color:white}.danger{color:#a52626}.msg{margin-left:8px;font-size:13px}.records{display:grid;gap:10px}.card{border:1px solid #dfe3e7;border-radius:12px;padding:14px}.top{display:flex;justify-content:space-between;gap:10px}.company{font-size:18px;font-weight:800}.meta{color:#66717b;font-size:13px;margin-top:4px}.detail{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px;font-size:14px}.badge{padding:5px 9px;border-radius:999px;background:#e9f6ee;color:#176b37;font-size:12px;height:max-content}.no{background:#fbeaea;color:#9c2929}.login{position:fixed;inset:0;background:#16212b;display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}.loginbox{width:min(420px,100%);background:white;border-radius:16px;padding:24px}.loginbox h2{margin-top:0}.hidden{display:none!important}.summary{font-weight:700;padding:9px 0}.logout{float:right;background:transparent;color:white;border:1px solid #ffffff55;border-radius:8px;padding:7px 10px}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column <div id="login" class="login"><form id="loginForm" class="loginbox"><h2>德曜精密業務電訪記錄</h2><p>請輸入系統密碼後進入。</p><input id="pw" type="password" required autocomplete="current-password" placeholder="系統密碼"><div class="actions"><button class="btn primary">登入</button><span id="loginMsg" class="msg"></span></div></form></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const SUPABASE_URL="https://qprzfciypaiwvbkiiapo.supabase.co",KEY="sb_publishable_Bmn5OtlbGuGqQC4x0dNv7A_9_zldV2B",EMAIL="sales@de-yao.com.tw";
const sb=supabase.createClient(SUPABASE_URL,KEY),$=x=>document.getElementById(x);let data=[],editing=null;

function today(){return new Date().toISOString().slice(0,10)} function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function detectCity(address){let s=String(address||"").replace(/\s/g,"");for(const [city,names] of CITY_ALIASES){if(names.some(n=>s.includes(n)))return city}return ""}
function syncCityFromAddress(){let city=detectCity($("company_address").value);if(city)$("area").value=city}

async function load(){let {data:d,error}=await sb.from("cold_call_records").select("*").order("visit_date",{ascending:false}).order("created_at",{ascending:false});if(error){$("summary").textContent="讀取失敗："+error.message;return}data=d||[];render()}
function shown(){let q=$("search").value.toLowerCase().replace(/\s/g,""),dt=$("dateFilter").value;return data.filter(r=>(!dt||r.visit_date===dt)&&(!q||Object.values(r).join(" ").toLowerCase().replace(/\s/g,"").includes(q)))}
function render(){let a=shown(),dt=$("dateFilter").value;$("summary").textContent=(dt?dt+" 當日電訪共 ":"搜尋結果共 ")+a.length+" 筆｜雲端總資料 "+data.length+" 筆";$("records").innerHTML=a.length?a.map(r=>`<article class="card"><div class="top"><div><div class="company">${esc(r.company_name)}</div><div class="meta">${esc(r.visit_date||"")} ｜ 聯絡人：${esc(r.contact_name||"未填")}</div></div><span class="badge ${r.visit_suitable?"":"no"}">${r.visit_suitable?"適合拜訪":"暫不拜訪"}</span></div><div class="detail"><div>🏢 ${esc(r.company_address||"未提供")}</div><div>📞 ${esc(r.phone||"未提供")}</div><div>✉️ ${esc(r.email||"未提供")}（${r.mail_sent?"已寄送Mail":"未寄送Mail"}）</div><div>📍 ${esc(r.area||"未分類")}</div><div>👤 ${esc(r.recorder||"未指定")}</div><div>📝 ${esc(r.notes||"尚無備註")}</div></div><div class="actions"><button class="btn" onclick="editRec(${r.id})">編輯</button><button class="btn danger" onclick="delRec(${r.id})">刪除</button></div></article>`).join(""):'<p>目前沒有符合條件的資料。</p>'}
window.editRec=id=>{let r=data.find(x=>x.id===id);if(!r)return;editing=id;fields.forEach(k=>$(k).value=r[k]??"");$("mail_sent").value=String(!!r.mail_sent);$("visit_suitable").value=String(!!r.visit_suitable);$("formTitle").textContent="編輯電訪紀錄";scrollTo({top:0,behavior:"smooth"})}
window.delRec=async id=>{if(!confirm("確定刪除這筆紀錄？"))return;let {error}=await sb.from("cold_call_records").delete().eq("id",id);if(error)alert(error.message);else load()}
function norm(s){return String(s??"").trim().toLowerCase().replace(/\s+/g,"")}
function findDuplicate(p){let cn=norm(p.company_name),ph=norm(p.phone).replace(/[^0-9+]/g,""),em=norm(p.email);return data.find(r=>r.id!==editing&&((cn&&norm(r.company_name)===cn)||(ph&&norm(r.phone).replace(/[^0-9+]/g,"")===ph)||(em&&norm(r.email)===em)))}
$("form").onsubmit=async e=>{e.preventDefault();let p=payload(),dup=findDuplicate(p);if(dup){alert("⚠️ 已有客戶資訊！\n\n公司名稱："+(dup.company_name||"未填")+"\n聯絡人："+(dup.contact_name||"未填")+"\n電話："+(dup.phone||"未填")+"\nEmail："+(dup.email||"未填")+"\n\n請先確認客戶名單，避免重複建立資料。");return}let q=editing?sb.from("cold_call_records").update({...p,updated_at:new Date().toISOString()}).eq("id",editing):sb.from("cold_call_records").insert(p),{error}=await q;if(error){$("msg").textContent="儲存失敗："+error.message;return}reset();await load();$("msg").textContent="已儲存並同步雲端"}
$("company_address").addEventListener("input",syncCityFromAddress);$("company_address").addEventListener("change",syncCityFromAddress);$("cancel").onclick=reset;$("search").oninput=render;$("dateFilter").onchange=render;$("clearDate").onclick=()=>{$("dateFilter").value="";render()};
function exportRows(){return shown().map(r=>({"電訪日期":r.visit_date,"公司名稱":r.company_name,"公司地址":r.company_address,"聯絡人":r.contact_name,"電話":r.phone,"Email":r.email,"是否已寄送Mail":r.mail_sent?"是":"否","是否適合拜訪":r.visit_suitable?"是":"否","地區":r.area,"紀錄者":r.recorder,"公司官網":r.website,"備註":r.notes}))}
function csv(){let a=exportRows(),h=Object.keys(a[0]||{"公司名稱":""}),rows=[h,...a.map(o=>h.map(k=>o[k]??""))],s="\ufeff"+rows.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n"),b=new Blob([s],{type:"text/csv;charset=utf-8"}),u=window.URL.createObjectURL(b),ael=document.createElement("a");ael.href=u;ael.download="德曜精密業務電訪記錄.csv";ael.click();window.URL.revokeObjectURL(u)}
$("exportCsv").onclick=csv;
$("exportExcel").onclick=()=>{let rows=exportRows();if(!rows.length){alert("目前沒有可匯出的資料");return}let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"電訪紀錄");XLSX.writeFile(wb,"德曜精密業務電訪記錄.xlsx")};
$("refresh").onclick=load;
$("importExcel").onclick=()=>$("importFile").click();
$("importFile").onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:"array"}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});if(!rows.length){alert("Excel 沒有可匯入的資料");return}
let yn=v=>["是","true","1","yes","y","已寄送","適合","適合拜訪"].includes(String(v).trim().toLowerCase());
let mapped=rows.map(r=>({visit_date:String(r["電訪日期"]||today()).slice(0,10),company_name:String(r["公司名稱"]||"").trim(),company_address:String(r["公司地址"]||""),contact_name:String(r["聯絡人"]||""),phone:String(r["電話"]||""),email:String(r["Email"]||r["email"]||""),mail_sent:yn(r["是否已寄送Mail"]),visit_suitable:yn(r["是否適合拜訪"]),area:detectCity(r["公司地址"])||String(r["縣市"]||r["地區"]||""),recorder:String(r["紀錄者"]||""),website:String(r["公司官網"]||""),notes:String(r["備註"]||"")})).filter(r=>r.company_name);

if(!confirm("即將匯入 "+mapped.length+" 筆資料到雲端，確定繼續？"))return;
let {error}=await sb.from("cold_call_records").insert(mapped);if(error)throw error;alert("匯入成功："+mapped.length+" 筆");await load()
}catch(err){alert("匯入失敗："+(err.message||err))}finally{e.target.value=""}};
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginMsg").textContent="登入中…";let {error}=await sb.auth.signInWithPassword({email:EMAIL,password:$("pw").value});if(error){$("loginMsg").textContent="密碼錯誤，請重新輸入";return}$("login").classList.add("hidden");$("pw").value="";await load();reset()}

(async()=>{reset();let {data:{session}}=await sb.auth.getSession();if(session){$("login").classList.add("hidden");await load()}})();
</script></body></html>
